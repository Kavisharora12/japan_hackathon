services:
  backend:
    build:
      context: ./backend_go
      dockerfile: Dockerfile
    container_name: japan-saathi-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyAG1Ffq1QkNkVlFnCxgEPa-ebodCNHYSx8}
      - AMADEUS_CLIENT_ID=${AMADEUS_CLIENT_ID:-}
      - AMADEUS_CLIENT_SECRET=${AMADEUS_CLIENT_SECRET:-}
      - AMADEUS_ENV=${AMADEUS_ENV:-test}
    restart: unless-stopped

  frontend:
    build:
      context: ./japan-saathi
      dockerfile: Dockerfile
    container_name: japan-saathi-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyAG1Ffq1QkNkVlFnCxgEPa-ebodCNHYSx8}
    depends_on:
      - backend
    restart: unless-stopped
