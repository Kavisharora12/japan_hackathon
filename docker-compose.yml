services:
  backend:
    build:
      context: ./backend_go
      dockerfile: Dockerfile
    container_name: japan-saathi-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./japan-saathi
      dockerfile: Dockerfile
    container_name: japan-saathi-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mobile:
    build:
      context: ./japan-saathi-mobile
      dockerfile: Dockerfile
    container_name: japan-saathi-mobile
    ports:
      - "8081:8081"
    restart: unless-stopped
