name: CI/CD Pipeline - Japan Saathi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ── 1. Backend Verification (Go Planner & Tools) ────────────────
  backend-test:
    name: Test Go Backend Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend_go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend_go/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go Unit & Integration Tests
        run: go test -v -race ./...

  # ── 2. Frontend Verification (Next.js Web App) ───────────────────
  frontend-check:
    name: Check & Build Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./japan-saathi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: japan-saathi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck & Rule Evals (70/70 dietary checks)
        run: npm run check

      - name: Build Standalone Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ── 3. Docker Multi-Container Build & Deploy Verification ───────
  docker-build:
    name: Build & Verify Docker Containers
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Copy env template for build validation
        run: cp .env.example .env

      - name: Verify Docker Compose Configuration
        run: docker compose config

      - name: Build All Docker Services (Backend, Web, Mobile)
        run: docker compose build --parallel
